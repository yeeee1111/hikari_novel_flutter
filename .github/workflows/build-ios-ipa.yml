name: Build unsigned IPA (cloudflare bypass branch)

# 构建上游 refactor/cloudflare_bypass 分支（Rust wreq 模拟 Chrome TLS 指纹，绕过 Cloudflare）
#
# 已修的上游问题：
#   1) libc 0.2.190 删除 iOS 的 _dyld_* → backtrace 0.3.76 编不过  → 钉回旧版 libc
#   2) App 链接缺 libc++（BoringSSL 是 C++ 写的）                  → 补 -lc++
#   3) Rust 侧部署目标与 SDK 不匹配                                → IPHONEOS_DEPLOYMENT_TARGET=15.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ipa-cf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout upstream bypass branch
        uses: actions/checkout@v4
        with:
          repository: 15dd/hikari_novel_flutter
          ref: refactor/cloudflare_bypass
          fetch-depth: 1

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST/Contents/Developer" || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Install Rust + native deps
        run: |
          set -euo pipefail
          brew install cmake nasm ninja || true
          if ! command -v rustup >/dev/null 2>&1; then
            brew install rustup-init
            rustup-init -y --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          cargo --version
          rustc --version

      - name: Export env and patch xcconfig
        run: |
          LIBCLANG="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          {
            echo "LIBCLANG_PATH=$LIBCLANG"
            echo "RUST_BACKTRACE=1"
            echo "IPHONEOS_DEPLOYMENT_TARGET=15.0"
          } >> "$GITHUB_ENV"

          for f in ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig ios/Flutter/Profile.xcconfig; do
            if [ -f "$f" ] && ! grep -q 'lc++' "$f"; then
              printf '\nOTHER_LDFLAGS = $(inherited) -lc++\n' >> "$f"
              echo "patched $f"
            fi
          done
          echo '--- Release.xcconfig ---'
          cat ios/Flutter/Release.xcconfig

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      - name: flutter pub get
        run: flutter pub get

      # 修复 1：libc 0.2.190 移除了 iOS 的 _dyld_* 绑定，backtrace 0.3.76 因此编不过
      - name: Pin libc for backtrace (workaround)
        run: |
          set -euo pipefail
          if [ ! -d rust ]; then echo '没有 rust 目录，跳过'; exit 0; fi
          cd rust
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          echo '--- 修改前 ---'
          grep -A1 'name = "libc"' Cargo.lock | head -n 4 || true
          PINNED=""
          for v in 0.2.150 0.2.155 0.2.160 0.2.165 0.2.170 0.2.175 0.2.180 0.2.185 0.2.189; do
            if cargo update -p libc --precise "$v" >/dev/null 2>&1; then
              PINNED="$v"
              break
            fi
          done
          if [ -n "$PINNED" ]; then echo "libc 已钉到 $PINNED"; else echo '钉版本失败，保持原样'; fi
          grep -A1 'name = "libc"' Cargo.lock | head -n 4 || true

      - name: Prebuild Rust (diagnostic)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -d rust ]; then echo '没有 rust 目录'; exit 0; fi
          cd rust
          echo '--- cargo build start ---'
          cargo build --release --target aarch64-apple-ios 2>&1 | tee ../cargo-build.log | tail -n 200
          echo '--- cargo build ok ---'

      - name: Build iOS (no codesign)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build-ios.log | tail -n 300

      - name: Package unsigned IPA
        if: always()
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo '没有产出 Runner.app（构建失败，请查看 cargo-build.log / build-ios.log）'
            exit 0
          fi
          lipo -info "$APP/Runner" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

          rm -rf Payload hikari-cf-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          xattr -cr Payload || true
          find Payload -name '.DS_Store' -delete || true

          P="Payload/Runner.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$P"

          ditto -c -k --sequesterRsrc --keepParent Payload hikari-cf-unsigned.ipa
          rm -rf Payload
          ls -lh hikari-cf-unsigned.ipa

      - name: Upload logs and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-cf-build-${{ github.run_number }}
          path: |
            hikari-cf-unsigned.ipa
            build-ios.log
            cargo-build.log
          if-no-files-found: warn
          retention-days: 30
