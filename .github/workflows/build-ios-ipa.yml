name: Build unsigned IPA (cloudflare bypass branch)

# 构建上游 refactor/cloudflare_bypass 分支（Rust wreq 模拟 Chrome TLS 指纹，绕过 Cloudflare）
# 放在 fork 的 main 分支的 .github/workflows/build-ios-ipa.yml 里，checkout 时直接拉上游分支

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ipa-cf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout upstream bypass branch
        uses: actions/checkout@v4
        with:
          repository: 15dd/hikari_novel_flutter
          ref: refactor/cloudflare_bypass
          fetch-depth: 1

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST/Contents/Developer" || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      # Rust 工具链：Cargokit 通过 podspec 的 script phase 编出 libhikari_http.a
      # 不装 Homebrew llvm（太慢），libclang 用 Xcode 自带的
      - name: Install Rust + native deps
        run: |
          set -euo pipefail
          brew install cmake nasm ninja || true
          if ! command -v rustup >/dev/null 2>&1; then
            brew install rustup-init
            rustup-init -y --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          echo '--- 工具链版本 ---'
          cargo --version
          rustc --version
          rustup show
          rustup target list --installed

      - name: Export Rust env
        run: |
          LIBCLANG="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
          echo "RUST_BACKTRACE=1" >> "$GITHUB_ENV"
          echo '--- libclang 自检 ---'
          ls -la "$LIBCLANG" | grep -i clang | head -n 5 || echo '找不到 libclang'

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      - name: flutter pub get
        run: flutter pub get

      # 诊断步骤：单独编 Rust，把完整 rustc 错误写进 cargo-build.log
      # 失败也继续（continue-on-error），保证后面的 flutter build 和日志上传都会发生
      - name: Prebuild Rust (diagnostic)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -d rust ]; then echo '没有 rust 目录'; exit 0; fi
          cd rust
          ls -la
          echo '--- cargo build start ---'
          cargo build --release --target aarch64-apple-ios 2>&1 | tee ../cargo-build.log | tail -n 200
          echo '--- cargo build ok ---'

      - name: Build iOS (no codesign)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build-ios.log | tail -n 300

      - name: Package unsigned IPA
        if: always()
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo '没有产出 Runner.app（构建失败，请查看 cargo-build.log / build-ios.log）'
            exit 0
          fi
          lipo -info "$APP/Runner" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

          rm -rf Payload hikari-cf-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          xattr -cr Payload || true
          find Payload -name '.DS_Store' -delete || true

          P="Payload/Runner.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$P"

          ditto -c -k --sequesterRsrc --keepParent Payload hikari-cf-unsigned.ipa
          rm -rf Payload
          ls -lh hikari-cf-unsigned.ipa

      - name: Upload logs and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-cf-build-${{ github.run_number }}
          path: |
            hikari-cf-unsigned.ipa
            build-ios.log
            cargo-build.log
          if-no-files-found: warn
          retention-days: 30
